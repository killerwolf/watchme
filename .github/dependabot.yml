version: 2

# Every ecosystem targets `develop`, not the default branch: CONTRIBUTING
# makes `develop` the branch pull requests land on, and `main` only ever
# advances through a release. Left unset, Dependabot aims at `main` and its
# bumps skip the branch that is actually developed and tested.
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - deps
    groups:
      # Minor and patch updates are grouped into a single PR: that weekly
      # noise is what eventually stops anyone reading Dependabot at all.
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: /src-tauri
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - deps

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    labels:
      - ci
