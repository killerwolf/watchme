version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - deps
    groups:
      # Les mises a jour mineures et correctives sont regroupees en une
      # seule PR : c'est le bruit hebdomadaire qui fait qu'on finit par
      # ne plus lire Dependabot du tout.
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # ps-list expose directement pid/name/cmd au renderer : une majeure
      # doit etre evaluee a la main, pas mergee au fil de l'eau (cf. #16).
      - dependency-name: ps-list
        update-types:
          - version-update:semver-major
      # electron-store porte la persistance des preferences : une majeure
      # peut faire perdre leurs reglages aux utilisateurs (cf. #15).
      - dependency-name: electron-store
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - ci
