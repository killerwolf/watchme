name: Build, Test, and Release

on:
  # The `test` job has to run on main, or the workflow badge stays stuck on
  # "no status": GitHub computes it from runs on the default branch, and a
  # `pull_request` run is attributed to the PR's branch, not to main. The
  # `build` job stays guarded by its refs/tags condition, so a push to main
  # publishes nothing.
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: '22'

jobs:
  test:
    name: Test and Lint
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run tests
        run: npm test

      - name: Test build (pack only)
        run: npm run pack

      - name: Verify packaged app
        run: npm run verify:pack

  build:
    name: Build & Publish mac
    runs-on: macos-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    env:
      # The token GitHub provides is enough to publish to this repo: no PAT
      # to maintain or rotate.
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # --allow-same-version became necessary once package.json started
      # carrying the real version: without it, npm exits with "Version not
      # changed" when the tag already matches the file. The step is still
      # useful for a tag pushed without bumping first.
      - name: Set app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo "Setting app version to ${{ github.ref_name }}"
          npm version ${{ github.ref_name }} --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci

      - name: Determine release channel
        id: channel
        run: |
          # A semver prerelease tag (v1.0.0-rc.1) publishes as a prerelease.
          # electron-updater ignores those by default, so the prerelease
          # never reaches existing installs. A plain tag publishes as a
          # normal release.
          if [[ "${{ github.ref_name }}" == *-* ]]; then
            echo "release_type=prerelease" >> "$GITHUB_OUTPUT"
          else
            echo "release_type=release" >> "$GITHUB_OUTPUT"
          fi

      # The release is created HERE, before the build, and that is deliberate.
      #
      # electron-builder starts one publisher per architecture, in parallel.
      # If the release does not exist yet, both try to create it at the same
      # time: the first wins, the second gets a "422 already_exists" that
      # fails every one of its uploads. Seen on v0.11.1-rc.1: 1 file
      # published out of 8, 14 errors.
      #
      # Creating it up front means both publishers find it and simply drop
      # their files in. There is no longer a race to lose.
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${{ github.ref_name }}"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists, reusing it."
            exit 0
          fi

          args=(--title "$tag")
          if [ "${{ steps.channel.outputs.release_type }}" = "prerelease" ]; then
            args+=(--prerelease)
          fi

          # The CHANGELOG says why things changed, which a list of commits
          # does not. With no matching section, fall back to the notes
          # GitHub generates.
          version="${tag#v}"
          notes=$(awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md)

          if [ -n "$(echo "$notes" | tr -d '[:space:]')" ]; then
            printf '%s\n' "$notes" > /tmp/release-notes.md
            args+=(--notes-file /tmp/release-notes.md)
          else
            echo "No CHANGELOG section for $version, using generated notes."
            args+=(--generate-notes)
          fi

          gh release create "$tag" "${args[@]}"

      # electron-builder drops its artefacts into the release above.
      #
      # Two precautions:
      #  - only a tag publishes. `workflow_dispatch` is for verifying a
      #    build, not for creating a release named after the package.json
      #    version.
      #  - releaseType is forced. electron-builder defaults to `draft`,
      #    which would publish invisible releases.
      - name: Build and publish for mac
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            npm run build:mac -- \
              --publish always \
              -c.publish.releaseType=${{ steps.channel.outputs.release_type }}
          else
            npm run build:mac -- --publish never
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-mac
          path: dist/
          retention-days: 30
