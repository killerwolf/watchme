name: Build, Test, and Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: '22'

jobs:
  test:
    name: Test and Lint
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run tests
        run: npm test

      - name: Test build (pack only)
        run: npm run pack

      - name: Verify packaged app
        run: npm run verify:pack

  build:
    name: Build & Publish mac
    runs-on: macos-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    env:
      # Le token fourni par GitHub suffit pour publier sur ce depot :
      # aucun PAT a maintenir ni a faire tourner.
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # --allow-same-version est indispensable depuis que package.json porte
      # la vraie version : sans lui, npm sort en erreur "Version not changed"
      # quand le tag correspond deja a la version du fichier. L'etape reste
      # utile pour un tag pose sans bump prealable.
      - name: Set app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo "Setting app version to ${{ github.ref_name }}"
          npm version ${{ github.ref_name }} --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci

      - name: Determine release channel
        id: channel
        run: |
          # Un tag semver de preversion (v1.0.0-rc.1) publie en prerelease.
          # electron-updater les ignore par defaut : la preversion n'atteint
          # donc pas les installations existantes. Un tag simple publie en
          # release normale.
          if [[ "${{ github.ref_name }}" == *-* ]]; then
            echo "release_type=prerelease" >> "$GITHUB_OUTPUT"
          else
            echo "release_type=release" >> "$GITHUB_OUTPUT"
          fi

      # C'est electron-builder qui publie ce qu'il vient de construire, plutot
      # qu'un job separe qui retelechargerait les artefacts pour les reposter.
      #
      # Deux precautions :
      #  - on ne publie que sur un tag. `workflow_dispatch` sert a verifier un
      #    build, pas a creer une release au nom de la version du package.json.
      #  - releaseType est force. Le defaut d'electron-builder est `draft`, ce
      #    qui publierait des releases invisibles.
      - name: Build and publish for mac
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            npm run build:mac -- \
              --publish always \
              -c.publish.releaseType=${{ steps.channel.outputs.release_type }}
          else
            npm run build:mac -- --publish never
          fi

      # electron-builder publie les binaires mais laisse le corps de la release
      # vide. On y met la section correspondante du CHANGELOG, qui dit le
      # pourquoi des changements — ce qu'une liste de commits ne fait pas.
      - name: Fill release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="${{ github.ref_name }}"
          version="${version#v}"
          notes=$(awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md)

          if [ -z "$(echo "$notes" | tr -d '[:space:]')" ]; then
            echo "Aucune section CHANGELOG pour $version, corps laisse tel quel."
            exit 0
          fi

          printf '%s\n' "$notes" > /tmp/release-notes.md
          gh release edit "${{ github.ref_name }}" --notes-file /tmp/release-notes.md

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-mac
          path: dist/
          retention-days: 30
