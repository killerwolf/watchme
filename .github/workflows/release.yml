name: Build, Test, and Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: '22'

jobs:
  test:
    name: Test and Lint
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run tests
        run: npm test

      - name: Test build (pack only)
        run: npm run pack

      - name: Verify packaged app
        run: npm run verify:pack

  build:
    name: Build & Publish mac
    runs-on: macos-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    env:
      # Le token fourni par GitHub suffit pour publier sur ce depot :
      # aucun PAT a maintenir ni a faire tourner.
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # --allow-same-version est indispensable depuis que package.json porte
      # la vraie version : sans lui, npm sort en erreur "Version not changed"
      # quand le tag correspond deja a la version du fichier. L'etape reste
      # utile pour un tag pose sans bump prealable.
      - name: Set app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo "Setting app version to ${{ github.ref_name }}"
          npm version ${{ github.ref_name }} --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci

      - name: Determine release channel
        id: channel
        run: |
          # Un tag semver de preversion (v1.0.0-rc.1) publie en prerelease.
          # electron-updater les ignore par defaut : la preversion n'atteint
          # donc pas les installations existantes. Un tag simple publie en
          # release normale.
          if [[ "${{ github.ref_name }}" == *-* ]]; then
            echo "release_type=prerelease" >> "$GITHUB_OUTPUT"
          else
            echo "release_type=release" >> "$GITHUB_OUTPUT"
          fi

      # La release est creee ICI, avant le build, et c est delibere.
      #
      # electron-builder lance un publieur par architecture, en parallele.
      # Si la release n'existe pas encore, les deux essaient de la creer en
      # meme temps : le premier gagne, le second recoit un
      # "422 already_exists" qui fait echouer toutes ses mises en ligne.
      # Constate sur v0.11.1-rc.1 : 1 fichier publie sur 8, 14 erreurs.
      #
      # En la creant au prealable, les deux publieurs la trouvent et se
      # contentent d'y deposer leurs fichiers. Il n'y a plus rien a courir.
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${{ github.ref_name }}"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "La release $tag existe deja, elle sera reutilisee."
            exit 0
          fi

          args=(--title "$tag")
          if [ "${{ steps.channel.outputs.release_type }}" = "prerelease" ]; then
            args+=(--prerelease)
          fi

          # Le CHANGELOG dit le pourquoi des changements, ce qu'une liste de
          # commits ne fait pas. A defaut de section, on retombe sur les
          # notes generees par GitHub.
          version="${tag#v}"
          notes=$(awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md)

          if [ -n "$(echo "$notes" | tr -d '[:space:]')" ]; then
            printf '%s\n' "$notes" > /tmp/release-notes.md
            args+=(--notes-file /tmp/release-notes.md)
          else
            echo "Aucune section CHANGELOG pour $version, notes generees."
            args+=(--generate-notes)
          fi

          gh release create "$tag" "${args[@]}"

      # electron-builder depose ses artefacts dans la release ci-dessus.
      #
      # Deux precautions :
      #  - on ne publie que sur un tag. `workflow_dispatch` sert a verifier un
      #    build, pas a creer une release au nom de la version du package.json.
      #  - releaseType est force. Le defaut d'electron-builder est `draft`, ce
      #    qui publierait des releases invisibles.
      - name: Build and publish for mac
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            npm run build:mac -- \
              --publish always \
              -c.publish.releaseType=${{ steps.channel.outputs.release_type }}
          else
            npm run build:mac -- --publish never
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-mac
          path: dist/
          retention-days: 30
