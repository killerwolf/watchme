name: Build, Test, and Release

on:
  # The `test` job has to run on main, or the workflow badge stays stuck on
  # "no status": GitHub computes it from runs on the default branch, and a
  # `pull_request` run is attributed to the PR's branch, not to main. The
  # `build` job stays guarded by its refs/tags condition, so a push to main
  # publishes nothing.
  #
  # `develop` is where work actually lands — CONTRIBUTING points pull requests
  # there — so it needs the same coverage: the pull request before a merge, and
  # the merge commit after it. Without the second, a branch that was green on
  # its own can still redden `develop` and nothing says so until release time.
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

env:
  NODE_VERSION: '22'

jobs:
  test:
    name: Test and Lint
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run tests
        run: npm test

      - name: Test build (pack only)
        run: npm run pack

  build:
    name: Build & Publish mac
    runs-on: macos-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    env:
      # The token GitHub provides is enough to publish to this repo: no PAT
      # to maintain or rotate.
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # --allow-same-version became necessary once package.json started
      # carrying the real version: without it, npm exits with "Version not
      # changed" when the tag already matches the file. The step is still
      # useful for a tag pushed without bumping first.
      - name: Set app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo "Setting app version to ${{ github.ref_name }}"
          npm version ${{ github.ref_name }} --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci

      - name: Determine release channel
        id: channel
        run: |
          # A semver prerelease tag (v1.0.0-rc.1) publishes as a prerelease.
          # A plain tag publishes as a normal release; prerelease tags are marked
          # as such so they do not appear as stable downloads.
          if [[ "${{ github.ref_name }}" == *-* ]]; then
            echo "release_type=prerelease" >> "$GITHUB_OUTPUT"
          else
            echo "release_type=release" >> "$GITHUB_OUTPUT"
          fi

      # Create the release before building so the bundle upload has a stable
      # release target.
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${{ github.ref_name }}"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists, reusing it."
            exit 0
          fi

          args=(--title "$tag")
          if [ "${{ steps.channel.outputs.release_type }}" = "prerelease" ]; then
            args+=(--prerelease)
          fi

          # The CHANGELOG says why things changed, which a list of commits
          # does not. With no matching section, fall back to the notes
          # GitHub generates.
          version="${tag#v}"
          notes=$(awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md)

          if [ -n "$(echo "$notes" | tr -d '[:space:]')" ]; then
            printf '%s\n' "$notes" > release-notes.generated.md
            args+=(--notes-file release-notes.generated.md)
          else
            echo "No CHANGELOG section for $version, using generated notes."
            args+=(--generate-notes)
          fi

          gh release create "$tag" "${args[@]}"

      - name: Build macOS bundles
        run: |
          npm run build:mac

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          gh release upload "${{ github.ref_name }}" \
            src-tauri/target/release/bundle/dmg/* \
            --clobber

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-mac
          path: src-tauri/target/release/bundle/
          retention-days: 30
