<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>WatchMe</title>
    <!--
      No remote resources: the app has to work offline.
      The icons are inline SVGs taken from Font Awesome Free 6.7.2
      (Icons: CC BY 4.0 - https://fontawesome.com/license/free).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!--
      The window is undecorated, so this bar is the only way to move it.
      data-tauri-drag-region has to sit on every element that is not itself
      interactive, otherwise the gesture stops at the child.
    -->
    <header class="titlebar" data-tauri-drag-region>
      <div class="titlebar__brand">
        <svg class="icon" viewBox="0 0 576 512" aria-hidden="true"><path d="M288 32c-80.8 0-145.5 36.8-192.6 80.6C48.6 156 17.3 208 2.5 243.7c-3.3 7.9-3.3 16.7 0 24.6C17.3 304 48.6 356 95.4 399.4C142.5 443.2 207.2 480 288 480s145.5-36.8 192.6-80.6c46.8-43.5 78.1-95.4 93-131.1c3.3-7.9 3.3-16.7 0-24.6c-14.9-35.7-46.2-87.7-93-131.1C433.5 68.8 368.8 32 288 32zM144 256a144 144 0 1 1 288 0 144 144 0 1 1 -288 0zm144-64c0 35.3-28.7 64-64 64c-7.1 0-13.9-1.2-20.2-3.3c-5.5-1.8-11.9 1.6-11.6 7.4c.3 5.1 1.1 10.3 2.3 15.5c14.9 64.5 79.2 104.7 143.7 89.8s104.7-79.2 89.8-143.7c-12.1-52.3-58-89-110.2-89.3c-5.8 0-9.2 6.1-7.4 11.6c2.1 6.3 3.3 13.1 3.3 20.2z"/></svg>
        <span>WatchMe</span>
      </div>

      <div class="titlebar__spacer" data-tauri-drag-region></div>

      <div class="segmented" role="tablist" aria-label="Sections">
        <button
          type="button"
          class="segment is-active"
          data-tab="processes"
          role="tab"
          id="tab-processes"
          aria-controls="processes-tab"
          aria-selected="true"
        >
          Processes
        </button>
        <button
          type="button"
          class="segment"
          data-tab="preferences"
          role="tab"
          id="tab-preferences"
          aria-controls="preferences-tab"
          aria-selected="false"
        >
          Preferences
        </button>
      </div>

      <div class="titlebar__spacer" data-tauri-drag-region></div>

      <button
        type="button"
        class="icon-button"
        id="quit-app-button"
        aria-label="Quit WatchMe"
        title="Quit WatchMe"
      >
        <svg class="icon" viewBox="0 0 512 512" aria-hidden="true"><path d="M288 32c0-17.7-14.3-32-32-32s-32 14.3-32 32l0 224c0 17.7 14.3 32 32 32s32-14.3 32-32l0-224zM143.5 120.6c13.6-11.3 15.4-31.5 4.1-45.1s-31.5-15.4-45.1-4.1C49.7 115.4 16 181.8 16 256c0 132.5 107.5 240 240 240s240-107.5 240-240c0-74.2-33.8-140.6-86.6-184.6c-13.6-11.3-33.8-9.4-45.1 4.1s-9.4 33.8 4.1 45.1c38.9 32.3 63.5 81 63.5 135.4c0 97.2-78.8 176-176 176s-176-78.8-176-176c0-54.4 24.7-103.1 63.5-135.4z"/></svg>
      </button>
    </header>

    <main class="content">
      <!-- Processes -->
      <section
        class="tab-panel is-active"
        id="processes-tab"
        role="tabpanel"
        aria-labelledby="tab-processes"
      >
        <div class="toolbar">
          <div class="field">
            <svg class="field__icon" viewBox="0 0 512 512" aria-hidden="true"><path d="M416 208c0 45.9-14.9 88.3-40 122.7L502.6 457.4c12.5 12.5 12.5 32.8 0 45.3s-32.8 12.5-45.3 0L330.7 376c-34.4 25.2-76.8 40-122.7 40C93.1 416 0 322.9 0 208S93.1 0 208 0S416 93.1 416 208zM208 352a144 144 0 1 0 0-288 144 144 0 1 0 0 288z"/></svg>
            <input
              type="text"
              id="filter-input"
              placeholder="Filter by name or command…"
              aria-label="Filter processes"
              autocomplete="off"
              spellcheck="false"
            />
            <button
              type="button"
              class="field__clear"
              id="filter-clear"
              aria-label="Clear filter"
              hidden
            >
              <svg class="icon" viewBox="0 0 384 512" aria-hidden="true"><path d="M342.6 150.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L192 210.7 86.6 105.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L146.7 256 41.4 361.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L192 301.3 297.4 406.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L237.3 256 342.6 150.6z"/></svg>
            </button>
          </div>
          <span class="pill" id="watch-pill" hidden>
            <span class="pill__dot" aria-hidden="true"></span>
            <span id="watch-pill-text">0 watched</span>
          </span>
        </div>

        <div class="table-scroll" id="table-scroll">
          <table class="process-table">
            <colgroup>
              <col class="col-check" />
              <col class="col-pid" />
              <col class="col-name" />
              <col />
            </colgroup>
            <thead>
              <tr>
                <th scope="col"><span class="visually-hidden">Watch</span></th>
                <th scope="col">PID</th>
                <th scope="col">Name</th>
                <th scope="col">Command</th>
              </tr>
            </thead>
            <tbody id="process-table-body">
              <!-- Process rows will be dynamically inserted here -->
            </tbody>
          </table>
        </div>

        <div class="empty-state" id="process-empty" hidden>
          <svg class="icon" viewBox="0 0 512 512" aria-hidden="true"><path d="M416 208c0 45.9-14.9 88.3-40 122.7L502.6 457.4c12.5 12.5 12.5 32.8 0 45.3s-32.8 12.5-45.3 0L330.7 376c-34.4 25.2-76.8 40-122.7 40C93.1 416 0 322.9 0 208S93.1 0 208 0S416 93.1 416 208zM208 352a144 144 0 1 0 0-288 144 144 0 1 0 0 288z"/></svg>
          <p class="empty-state__title" id="process-empty-title">
            No processes found
          </p>
          <p class="empty-state__hint" id="process-empty-hint">
            Nothing matches the current filter.
          </p>
        </div>

        <footer class="statusbar">
          <span id="status-text">Loading processes…</span>
        </footer>
      </section>

      <!-- Preferences -->
      <section
        class="tab-panel"
        id="preferences-tab"
        role="tabpanel"
        aria-labelledby="tab-preferences"
      >
        <div class="prefs">
          <div class="prefs__inner">
            <div class="prefs__group">
              <h2 class="prefs__legend">General</h2>
              <div class="prefs__card">
                <label class="pref-row">
                  <span class="pref-row__text">
                    <span class="pref-row__label">Start at login</span>
                    <span class="pref-row__hint"
                      >Open WatchMe automatically when you log in.</span
                    >
                  </span>
                  <input type="checkbox" id="autoLaunch" class="switch" />
                </label>
              </div>
            </div>

            <div class="prefs__group">
              <h2 class="prefs__legend">When a watched process ends</h2>
              <div class="prefs__card">
                <label class="pref-row">
                  <span class="pref-row__text">
                    <span class="pref-row__label">Show a notification</span>
                    <span class="pref-row__hint"
                      >Post a desktop notification naming the process.</span
                    >
                  </span>
                  <input
                    type="checkbox"
                    id="desktopNotifications"
                    class="switch"
                  />
                </label>
                <label class="pref-row">
                  <span class="pref-row__text">
                    <span class="pref-row__label">Play a sound</span>
                    <span class="pref-row__hint"
                      >Chime once, even when notifications are silenced.</span
                    >
                  </span>
                  <input
                    type="checkbox"
                    id="notificationSound"
                    class="switch"
                  />
                </label>
              </div>
            </div>

            <div class="prefs__group">
              <h2 class="prefs__legend">Process list</h2>
              <div class="prefs__card">
                <div class="pref-row pref-row--stacked">
                  <span class="pref-row__text">
                    <label class="pref-row__label" for="prefilterRegex"
                      >Only show processes matching</label
                    >
                    <span class="pref-row__hint"
                      >A case-insensitive regular expression tested against the
                      name and the command. Leave empty to show everything.</span
                    >
                  </span>
                  <input
                    type="text"
                    id="prefilterRegex"
                    placeholder="node|cargo|python"
                    autocomplete="off"
                    spellcheck="false"
                    aria-describedby="prefilterRegex-error"
                  />
                  <span
                    class="pref-row__error"
                    id="prefilterRegex-error"
                    role="alert"
                    hidden
                  ></span>
                </div>
              </div>
            </div>

            <div class="prefs__actions">
              <span class="prefs__saved" id="prefs-saved" hidden>Saved</span>
              <button
                type="button"
                id="savePreferences"
                class="button"
                aria-label="Save Preferences"
              >
                Save
              </button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- Include renderer.js -->
    <script type="module" src="renderer.js"></script>
  </body>
</html>
