<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Script Watcher</title>
    <!--
      Aucune ressource distante : l'app doit fonctionner hors-ligne.
      Les icones sont des SVG inline extraits de Font Awesome Free 6.7.2
      (Icons: CC BY 4.0 - https://fontawesome.com/license/free).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'"
    />
    <!-- Include Custom CSS -->
    <style>
      /* Color Variables for Dark Theme */
      :root {
        --primary-bg-color: #313335; /* Dark gray background */
        --secondary-bg-color: #2b2b2b; /* Sidebar background */
        --text-color: #d6d6d6; /* Light text color */
        --accent-color: #0098ff; /* Bright accent color */
        --hover-bg-color: #3e4042; /* Hover state background */
      }

      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        background-color: var(--primary-bg-color);
        color: var(--text-color);
      }

      /* Sidebar Styling */
      #sidebar {
        position: fixed;
        top: 0;
        bottom: 0;
        width: 80px;
        background-color: var(--secondary-bg-color);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-top: 20px;
      }

      .sidebar-item {
        width: 100%;
        padding: 15px 0;
        color: var(--text-color);
        text-align: center;
        cursor: pointer;
        transition: background-color 0.3s;
      }

      .sidebar-item.active,
      .sidebar-item:hover {
        background-color: var(--hover-bg-color);
      }

      .sidebar-item .icon {
        width: 24px;
        height: 24px;
        fill: currentColor;
      }

      .sidebar-item span {
        display: block;
        font-size: 12px;
        margin-top: 5px;
      }

      /* Main Content Area */
      #main-content {
        margin-left: 80px; /* Same as sidebar width */
        padding: 20px;
        background-color: var(--primary-bg-color);
        /*height: 100vh; */
        height: calc(100vh - 40px);
        overflow-y: auto;
      }

      /* Process Table Styling */
      .process-table {
        width: 100%;
        border-collapse: collapse;
        color: var(--text-color);
      }

      .process-table th,
      .process-table td {
        padding: 12px 15px;
        border-bottom: 1px solid #4d4d4d;
      }

      .process-table th {
        background-color: var(--secondary-bg-color);
        text-align: left;
      }

      .process-table tr:hover {
        background-color: var(--hover-bg-color);
      }

      .process-table input[type='checkbox'] {
        transform: scale(1.2);
      }

      /* Window Controls */




      /* Notification Styling */
      .notification {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background-color: var(--secondary-bg-color);
        color: var(--text-color);
        padding: 15px 20px;
        border-radius: 5px;
        display: none;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      }

      .notification.show {
        display: block;
        animation:
          fadeIn 0.3s,
          fadeOut 0.3s 4.7s;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes fadeOut {
        from {
          opacity: 1;
        }
        to {
          opacity: 0;
        }
      }

      /* Preferences Styling */
      .preferences-container {
        max-width: 600px;
        margin: 0 auto;
      }

      .preference-group {
        margin-bottom: 20px;
      }

      .preference-label {
        display: flex;
        align-items: center;
        cursor: pointer;
      }

      .preference-label input[type='checkbox'] {
        margin-right: 10px;
      }

      input[type='text'] {
        width: 100%;
        padding: 10px;
        background-color: var(--secondary-bg-color);
        border: 1px solid #555;
        border-radius: 5px;
        color: var(--text-color);
      }

      .save-button {
        padding: 10px 20px;
        background-color: var(--accent-color);
        border: none;
        border-radius: 5px;
        color: var(--primary-bg-color);
        cursor: pointer;
      }

      .save-button:hover {
        background-color: #007acc;
      }

      /* Search Bar Styling */
      .search-container {
        position: relative;
        margin-bottom: 20px;
        max-width: 100%;
      }

      #filter-input {
        width: 100%;
        padding: 10px 35px 10px 10px;
        border: 1px solid #555;
        border-radius: 5px;
        background-color: var(--secondary-bg-color);
        color: var(--text-color);
        box-sizing: border-box;
      }

      .search-icon {
        width: 16px;
        height: 16px;
        fill: currentColor;
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        color: #a9b7c6;
        pointer-events: none;
      }

      /* Tab Content Animations */
      .tab-content {
        opacity: 0;
        transform: translateY(20px);
        transition:
          opacity 0.3s ease,
          transform 0.3s ease;
      }

      .tab-content.active {
        opacity: 1;
        transform: translateY(0);
      }
    </style>
  </head>
  <body>
    <!-- Sidebar Navigation -->
    <div id="sidebar">
      <div
        class="sidebar-item active"
        data-tab="processes"
        aria-label="Processes"
        role="button"
        tabindex="0"
      >
        <svg class="icon" viewBox="0 0 512 512" aria-hidden="true"><path d="M152.1 38.2c9.9 8.9 10.7 24 1.8 33.9l-72 80c-4.4 4.9-10.6 7.8-17.2 7.9s-12.9-2.4-17.6-7L7 113C-2.3 103.6-2.3 88.4 7 79s24.6-9.4 33.9 0l22.1 22.1 55.1-61.2c8.9-9.9 24-10.7 33.9-1.8zm0 160c9.9 8.9 10.7 24 1.8 33.9l-72 80c-4.4 4.9-10.6 7.8-17.2 7.9s-12.9-2.4-17.6-7L7 273c-9.4-9.4-9.4-24.6 0-33.9s24.6-9.4 33.9 0l22.1 22.1 55.1-61.2c8.9-9.9 24-10.7 33.9-1.8zM224 96c0-17.7 14.3-32 32-32l224 0c17.7 0 32 14.3 32 32s-14.3 32-32 32l-224 0c-17.7 0-32-14.3-32-32zm0 160c0-17.7 14.3-32 32-32l224 0c17.7 0 32 14.3 32 32s-14.3 32-32 32l-224 0c-17.7 0-32-14.3-32-32zM160 416c0-17.7 14.3-32 32-32l288 0c17.7 0 32 14.3 32 32s-14.3 32-32 32l-288 0c-17.7 0-32-14.3-32-32zM48 368a48 48 0 1 1 0 96 48 48 0 1 1 0-96z"/></svg>
        <span>Processes</span>
      </div>
      <div
        class="sidebar-item"
        data-tab="preferences"
        aria-label="Preferences"
        role="button"
        tabindex="0"
      >
        <svg class="icon" viewBox="0 0 512 512" aria-hidden="true"><path d="M495.9 166.6c3.2 8.7 .5 18.4-6.4 24.6l-43.3 39.4c1.1 8.3 1.7 16.8 1.7 25.4s-.6 17.1-1.7 25.4l43.3 39.4c6.9 6.2 9.6 15.9 6.4 24.6c-4.4 11.9-9.7 23.3-15.8 34.3l-4.7 8.1c-6.6 11-14 21.4-22.1 31.2c-5.9 7.2-15.7 9.6-24.5 6.8l-55.7-17.7c-13.4 10.3-28.2 18.9-44 25.4l-12.5 57.1c-2 9.1-9 16.3-18.2 17.8c-13.8 2.3-28 3.5-42.5 3.5s-28.7-1.2-42.5-3.5c-9.2-1.5-16.2-8.7-18.2-17.8l-12.5-57.1c-15.8-6.5-30.6-15.1-44-25.4L83.1 425.9c-8.8 2.8-18.6 .3-24.5-6.8c-8.1-9.8-15.5-20.2-22.1-31.2l-4.7-8.1c-6.1-11-11.4-22.4-15.8-34.3c-3.2-8.7-.5-18.4 6.4-24.6l43.3-39.4C64.6 273.1 64 264.6 64 256s.6-17.1 1.7-25.4L22.4 191.2c-6.9-6.2-9.6-15.9-6.4-24.6c4.4-11.9 9.7-23.3 15.8-34.3l4.7-8.1c6.6-11 14-21.4 22.1-31.2c5.9-7.2 15.7-9.6 24.5-6.8l55.7 17.7c13.4-10.3 28.2-18.9 44-25.4l12.5-57.1c2-9.1 9-16.3 18.2-17.8C227.3 1.2 241.5 0 256 0s28.7 1.2 42.5 3.5c9.2 1.5 16.2 8.7 18.2 17.8l12.5 57.1c15.8 6.5 30.6 15.1 44 25.4l55.7-17.7c8.8-2.8 18.6-.3 24.5 6.8c8.1 9.8 15.5 20.2 22.1 31.2l4.7 8.1c6.1 11 11.4 22.4 15.8 34.3zM256 336a80 80 0 1 0 0-160 80 80 0 1 0 0 160z"/></svg>
        <span>Preferences</span>
      </div>
      <!-- Add Quit App Button -->
      <div
        class="sidebar-item"
        id="quit-app-button"
        aria-label="Quit App"
        role="button"
        tabindex="0"
      >
        <svg class="icon" viewBox="0 0 512 512" aria-hidden="true"><path d="M288 32c0-17.7-14.3-32-32-32s-32 14.3-32 32l0 224c0 17.7 14.3 32 32 32s32-14.3 32-32l0-224zM143.5 120.6c13.6-11.3 15.4-31.5 4.1-45.1s-31.5-15.4-45.1-4.1C49.7 115.4 16 181.8 16 256c0 132.5 107.5 240 240 240s240-107.5 240-240c0-74.2-33.8-140.6-86.6-184.6c-13.6-11.3-33.8-9.4-45.1 4.1s-9.4 33.8 4.1 45.1c38.9 32.3 63.5 81 63.5 135.4c0 97.2-78.8 176-176 176s-176-78.8-176-176c0-54.4 24.7-103.1 63.5-135.4z"/></svg>
        <span>Quit App</span>
      </div>
    </div>

    <!-- Main Content Area -->
    <div id="main-content">
      <!-- Processes Tab Content -->
      <div class="tab-content active" id="processes-tab">
        <div class="search-container">
          <input
            type="text"
            id="filter-input"
            placeholder="Filter by name..."
          />
          <svg class="search-icon" viewBox="0 0 512 512" aria-hidden="true"><path d="M416 208c0 45.9-14.9 88.3-40 122.7L502.6 457.4c12.5 12.5 12.5 32.8 0 45.3s-32.8 12.5-45.3 0L330.7 376c-34.4 25.2-76.8 40-122.7 40C93.1 416 0 322.9 0 208S93.1 0 208 0S416 93.1 416 208zM208 352a144 144 0 1 0 0-288 144 144 0 1 0 0 288z"/></svg>
        </div>

        <table class="process-table">
          <thead>
            <tr>
              <th></th>
              <th>PID</th>
              <th>Name</th>
              <th>Command</th>
            </tr>
          </thead>
          <tbody id="process-table-body">
            <!-- Process rows will be dynamically inserted here -->
          </tbody>
        </table>
      </div>

      <!-- Preferences Tab Content -->
      <div class="tab-content" id="preferences-tab" style="display: none">
        <div class="preferences-container">
          <h2>Preferences</h2>
          <div class="preference-group">
            <label class="preference-label">
              <input type="checkbox" id="autoLaunch" />
              Start at Login
            </label>
          </div>
          <div class="preference-group">
            <label for="prefilterRegex">Process Name Filter (Regex):</label>
            <input
              type="text"
              id="prefilterRegex"
              placeholder="Enter regex pattern"
            />
          </div>
          <button
            type="button"
            id="savePreferences"
            class="save-button"
            aria-label="Save Preferences"
          >
            Save
          </button>
        </div>
      </div>
    </div>

    <!-- Notification Container -->
    <div id="notification" class="notification" role="alert">
      <p id="notification-message"></p>
    </div>

    <!-- Include renderer.js -->
    <script type="module" src="renderer.js"></script>
  </body>
</html>
